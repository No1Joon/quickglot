<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
<!-- Shared artwork. icon-square.svg and icon-tile.svg differ only in the plate
     behind this mark, so edit the letterform here and both stay in step.

     A Q rather than a magnifier: the ring plus a diagonal tail is the universal
     search glyph, and this app does not search. The tail is horizontal and in
     the accent colour, which reads as the line of text being translated. -->
<g id="mark">
  <circle cx="512" cy="452" r="252" fill="none" stroke="#FFFFFF" stroke-width="118"/>
  <rect x="470" y="700" width="330" height="118" rx="59" fill="#FFD166"/>
</g>
</svg>
